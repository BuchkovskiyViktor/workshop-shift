*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:640px;min-height:100vh;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 12px;gap:12px}.brand{font-weight:900;font-size:23px;letter-spacing:.01em}.sub{font-size:13px;color:var(--muted);margin-top:2px}.pill{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 11px;font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin:10px 0;box-shadow:0 2px 10px rgba(17,19,24,.035)}.hero{text-align:center;padding:24px 17px}.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.timer{font-size:43px;font-weight:900;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin:10px 0 6px}.section-title{font-size:18px;font-weight:900;margin:20px 2px 9px}.section-sub{font-size:13px;color:var(--muted);margin:-5px 2px 9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.btn{width:100%;border:0;border-radius:15px;padding:14px 12px;background:#eceff3;font-weight:800}.btn.primary{background:var(--dark);color:white}.btn.good{background:var(--goodbg);color:var(--good)}.btn.warn{background:var(--warnbg);color:var(--warn)}.btn.danger{background:var(--dangerbg);color:var(--danger)}.btn.blue{background:var(--bluebg);color:var(--blue)}.btn.small{padding:9px 10px;font-size:12px;border-radius:12px;width:auto}.btn:active{transform:scale(.99)}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 12px;outline:none}.field textarea{min-height:82px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:5px}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:20px;margin-top:4px}.list{display:flex;flex-direction:column;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.money{font-weight:900}.status{font-size:11px;padding:5px 8px;border-radius:999px;background:#edf0f3;white-space:nowrap}.status.good{background:var(--goodbg);color:var(--good)}.status.warn{background:var(--warnbg);color:var(--warn)}.status.danger{background:var(--dangerbg);color:var(--danger)}.status.blue{background:var(--bluebg);color:var(--blue)}.divider{border:0;border-top:1px solid var(--line);margin:14px 0}.comment{margin-top:9px;padding:10px 11px;border-radius:12px;background:#f3f5f7;font-size:13px;white-space:pre-wrap}.comment.manager{background:var(--bluebg);color:#244f88;font-style:italic}.comment.private{background:var(--privatebg);color:var(--private)}.comment strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.timeline{border-left:2px solid #dfe3e8;margin-left:6px;padding-left:13px}.segment{position:relative;padding:0 0 14px}.segment:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#111318;left:-19px;top:4px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));z-index:20}.bottom-inner{max-width:640px;margin:auto;display:grid;gap:4px}.bottom.employee .bottom-inner{grid-template-columns:repeat(4,1fr)}.bottom.manager .bottom-inner{grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:12px;font-size:11px}.nav.active{background:#eef0f3;color:var(--ink);font-weight:900}.modal{position:fixed;inset:0;background:rgba(10,12,16,.48);display:flex;align-items:flex-end;z-index:50}.sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 15px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h3{margin:0 0 8px}.notice{padding:12px;border-radius:14px;background:#fff6df;color:#845100;font-size:13px;margin:10px 0}.notice.good{background:var(--goodbg);color:var(--good)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 15px 40px rgba(17,19,24,.08)}.login-brand{font-size:27px;font-weight:950}.login-tag{color:var(--muted);margin:3px 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eff1f4;border-radius:14px;padding:4px;margin:12px 0}.tab{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:800}.tab.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-weight:700}.nowrap{white-space:nowrap}.right{text-align:right!important}.empty{padding:18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:5px}.login-error{color:var(--danger);font-size:13px;margin-top:9px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar .btn{width:auto}.big-number{font-size:27px;font-weight:900}.scroll-x{overflow:auto;-webkit-overflow-scrolling:touch}.mini{font-size:11px}.clickable{cursor:pointer}.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}.offline{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:80;background:#111318;color:#fff;border-radius:999px;padding:7px 11px;font-size:11px}
</style>

<body>
<div id="offlineBadge" class="offline hidden">Нет сети · данные сохраняются на устройстве</div>
<div id="root"></div>
<div id="modalRoot"></div>
<script src="./config.js"></script>
<script>
(function(){
'use strict';
const STORAGE='badWorkshopV3';
const cfg=window.BAD_WORKSHOP_CONFIG||{};
const now=()=>Date.now();
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
const dateKey=(ts)=>{const d=new Date(ts);const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const fmtDate=(ts)=>new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtShortDate=(ts)=>new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'});
const fmtTime=(ts)=>new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const fmtMoney=(v)=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(Number(v)||0))+' грн';
const fmtDur=(ms)=>{const min=Math.max(0,Math.round(ms/60000));return Math.floor(min/60)+' ч '+String(min%60).padStart(2,'0')+' мин'};
const esc=(v)=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const store={get(){try{return JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){return null}},set(v){try{localStorage.setItem(STORAGE,JSON.stringify(v));return true}catch(e){return false}}};
function seed(){
 const t=now();
 return {
  version:3,
  session:null,
  users:[
   {id:'m1',name:'Виктор',email:'boss@bad.work',pin:'1234',role:'manager',approved:true,position:'Руководитель'},
   {id:'e1',name:'Сергей',email:'sergey@bad.work',pin:'1111',role:'employee',approved:true,position:'Монтажник'},
   {id:'e2',name:'Андрей',email:'andrey@bad.work',pin:'2222',role:'employee',approved:true,position:'Постановщик'},
   {id:'e3',name:'Николай',email:'new@bad.work',pin:'3333',role:'employee',approved:false,position:'Монтажник'}
  ],
  payRules:{
   e1:{baseShift:3000,baseHours:12,overtime:350,nightPct:0,restThreshold:8,shortRestBonus:500},
   e2:{baseShift:2800,baseHours:10,overtime:320,nightPct:20,restThreshold:8,shortRestBonus:400}
  },
  projects:[
   {id:'p1',name:'Film 125',active:true,createdBy:'m1',createdAt:t-7*86400000},
   {id:'p2',name:'Event BMW',active:true,createdBy:'m1',createdAt:t-4*86400000},
   {id:'p3',name:'Coca-Cola Event',active:true,createdBy:'m1',createdAt:t-2*86400000}
  ],
  workTypes:['Изготовление','Сборка','Сварка','Столярка','Покраска','Бутафория','Погрузка','Разгрузка','Логистика','Монтаж','Демонтаж','Работа на площадке','Закупка','Прочее'],
  shifts:[
   {id:'s_demo1',employeeId:'e1',start:t-26*3600000,end:t-14*3600000,status:'approved',segments:[
    {id:'sg1',projectId:'p1',workType:'Изготовление',start:t-26*3600000,end:t-22*3600000,employeeComment:'Собрал каркас задней стены.',managerReply:'Принято. Завтра усилить левый угол.',privateNote:'Проверить свой набор сверл.'},
    {id:'sg2',projectId:'p2',workType:'Монтаж',start:t-21.5*3600000,end:t-14*3600000,employeeComment:'Монтаж занял дольше из-за позднего доступа на площадку.',managerReply:'Учтено в отчёте проекта.',privateNote:''}
   ],expenses:[{id:'ex1',projectId:'p2',category:'Материалы',amount:480,comment:'Крепёж',status:'approved'}],transport:[]},
   {id:'s_demo2',employeeId:'e2',start:t-7.2*3600000,end:null,status:'active',segments:[
    {id:'sg3',projectId:'p3',workType:'Покраска',start:t-7.2*3600000,end:t-4.4*3600000,employeeComment:'Первый слой готов.',managerReply:'',privateNote:'Не забыть забрать респиратор.'},
    {id:'sg4',projectId:'p3',workType:'Монтаж',start:t-4.1*3600000,end:null,employeeComment:'Собираем центральную часть.',managerReply:'',privateNote:''}
   ],expenses:[],transport:[]}
  ],
  projectCosts:[
   {id:'c1',projectId:'p3',date:t-86400000,category:'Материалы',amount:12400,comment:'Фанера и брус',createdBy:'m1'},
   {id:'c2',projectId:'p2',date:t-2*86400000,category:'Аренда',amount:6500,comment:'Подъёмник',createdBy:'m1'}
  ],
  payments:[],
  settings:{hourlyRefreshMin:60,lastManagerSnapshot:null}
 };
}
let state=store.get()||seed();
function save(){store.set(state)}
function currentUser(){return state.users.find(u=>u.id===state.session?.userId)||null}
function userById(id){return state.users.find(u=>u.id===id)}
function projectById(id){return state.projects.find(p=>p.id===id)}
function ruleFor(id){return state.payRules[id]||{baseShift:0,baseHours:12,overtime:0,nightPct:0,restThreshold:8,shortRestBonus:0}}
function activeShiftFor(employeeId){return state.shifts.find(s=>s.employeeId===employeeId&&s.status==='active')||null}
function activeSegment(s){if(!s)return null;const x=s.segments[s.segments.length-1];return x&&!x.end?x:null}
function workMs(s,at=now()){return (s?.segments||[]).reduce((a,x)=>a+Math.max(0,(x.end||at)-x.start),0)}
function expensesSum(s){return (s?.expenses||[]).reduce((a,x)=>a+Number(x.amount||0),0)}
function transportSum(s){return (s?.transport||[]).reduce((a,x)=>a+Number(x.amount||0),0)}
function restBonus(s){const rule=ruleFor(s.employeeId);if(!s.start||!rule.shortRestBonus)return 0;const prev=state.shifts.filter(x=>x.employeeId===s.employeeId&&x.end&&x.end<s.start).sort((a,b)=>b.end-a.end)[0];if(!prev)return 0;const rest=(s.start-prev.end)/3600000;return rest<Number(rule.restThreshold||0)?Number(rule.shortRestBonus||0):0}
function calcShift(s,at=now()){const ms=workMs(s,at);const h=ms/3600000;const r=ruleFor(s.employeeId);let workPay=0;if(h>0){workPay=Number(r.baseShift||0);if(h>Number(r.baseHours||0))workPay+=(h-Number(r.baseHours||0))*Number(r.overtime||0)}const rb=restBonus(s);return{ms,h,workPay,restBonus:rb,expenses:expensesSum(s),transport:transportSum(s),total:workPay+rb+expensesSum(s)+transportSum(s)}}
function projectLabor(projectId,from,to){let ms=0,cost=0;for(const s of state.shifts){const r=ruleFor(s.employeeId);for(const seg of s.segments||[]){if(seg.projectId!==projectId)continue;const a=Math.max(seg.start,from||0);const b=Math.min(seg.end||now(),to||Infinity);if(b>a){const d=b-a;ms+=d;const hourly=r.baseHours?Number(r.baseShift||0)/Number(r.baseHours):0;cost+=d/3600000*hourly}}}return{ms,cost}}
function managerProjectCost(projectId,from,to){return state.projectCosts.filter(c=>c.projectId===projectId&&(!from||c.date>=from)&&(!to||c.date<to)).reduce((a,c)=>a+Number(c.amount||0),0)}
function startOfDay(ts=now()){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function endOfDay(ts=now()){return startOfDay(ts)+86400000}
function publicSegmentHtml(seg,managerMode=false){let html='';if(seg.employeeComment)html+=`<div class="comment"><strong>Комментарий сотрудника</strong>${esc(seg.employeeComment)}</div>`;if(seg.managerReply)html+=`<div class="comment manager"><strong>Ответ руководителя</strong>${esc(seg.managerReply)}</div>`;if(!managerMode&&seg.privateNote)html+=`<div class="comment private"><strong>Приватная заметка · только вам</strong>${esc(seg.privateNote)}</div>`;return html}
function statusText(s){return s.status==='active'?'В работе':s.status==='submitted'?'На проверке':s.status==='approved'?'Подтверждено':'Черновик'}
function statusClass(s){return s.status==='approved'?'good':s.status==='submitted'?'warn':s.status==='active'?'blue':''}
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" id="modalBackdrop"><div class="sheet">${html}</div></div>`;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function setSession(id){state.session={userId:id,loginAt:now()};save();renderApp()}
function logout(){state.session=null;save();renderApp()}
function renderApp(){const root=document.getElementById('root');const u=currentUser();if(!u){root.innerHTML=loginHtml();wireLogin();return}if(u.role==='employee'&&!u.approved){root.innerHTML=pendingHtml(u);document.getElementById('logoutPending').onclick=logout;return}root.innerHTML=shellHtml(u);if(u.role==='employee')renderEmployee(u);else renderManager(u);wireCommon()}
function loginHtml(){return `<div class="login-wrap"><div class="login-card"><div class="login-brand">.B.A.D.Workshop</div><div class="login-tag">Учёт смен, проектов и затрат</div><div class="tabs"><button class="tab active" id="loginTab">Вход</button><button class="tab" id="requestTab">Запрос доступа</button></div><div id="loginPanel"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="name@example.com"></div><div class="field"><label>PIN / пароль</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div><button class="btn primary" id="loginBtn">ВОЙТИ</button><div id="loginError" class="login-error"></div></div><div id="requestPanel" class="hidden"><div class="field"><label>Имя и фамилия</label><input id="reqName"></div><div class="field"><label>Email</label><input id="reqEmail" type="email"></div><div class="field"><label>Должность</label><input id="reqPosition" placeholder="Монтажник"></div><div class="field"><label>Придумайте PIN</label><input id="reqPin" type="password" inputmode="numeric"></div><button class="btn primary" id="reqBtn">ОТПРАВИТЬ ЗАПРОС</button><div class="hint">Новая учётная запись создаётся как сотрудник. Использование приложения станет доступно после подтверждения руководителем.</div><div id="reqResult"></div></div></div></div>`}
function wireLogin(){const loginTab=document.getElementById('loginTab'),requestTab=document.getElementById('requestTab'),lp=document.getElementById('loginPanel'),rp=document.getElementById('requestPanel');loginTab.onclick=()=>{loginTab.classList.add('active');requestTab.classList.remove('active');lp.classList.remove('hidden');rp.classList.add('hidden')};requestTab.onclick=()=>{requestTab.classList.add('active');loginTab.classList.remove('active');rp.classList.remove('hidden');lp.classList.add('hidden')};document.getElementById('loginBtn').onclick=()=>{const email=document.getElementById('loginEmail').value.trim().toLowerCase();const pin=document.getElementById('loginPin').value;const u=state.users.find(x=>x.email.toLowerCase()===email&&x.pin===pin);if(!u){document.getElementById('loginError').textContent='Неверный email или PIN.';return}setSession(u.id)};document.getElementById('reqBtn').onclick=()=>{const name=document.getElementById('reqName').value.trim(),email=document.getElementById('reqEmail').value.trim().toLowerCase(),position=document.getElementById('reqPosition').value.trim(),pin=document.getElementById('reqPin').value.trim();if(!name||!email||pin.length<4){document.getElementById('reqResult').innerHTML='<div class="login-error">Заполните имя, email и PIN минимум из 4 символов.</div>';return}if(state.users.some(x=>x.email.toLowerCase()===email)){document.getElementById('reqResult').innerHTML='<div class="login-error">Такой email уже зарегистрирован.</div>';return}state.users.push({id:uid('e'),name,email,pin,position:position||'Сотрудник',role:'employee',approved:false});save();document.getElementById('reqResult').innerHTML='<div class="notice good">Запрос отправлен. Руководитель должен подтвердить доступ.</div>'}}
function pendingHtml(u){return `<div class="login-wrap"><div class="login-card"><div class="login-brand">.B.A.D.Workshop</div><div class="section-title">Доступ ожидает подтверждения</div><div class="notice">${esc(u.name)}, ваша заявка создана. До подтверждения руководителем рабочие функции недоступны.</div><button class="btn" id="logoutPending">Выйти</button></div></div>`}
function shellHtml(u){const manager=u.role==='manager';const nav=manager?`<button class="nav active" data-page="mgrDash">Сводка</button><button class="nav" data-page="mgrProjects">Проекты</button><button class="nav" data-page="mgrPeople">Люди</button><button class="nav" data-page="mgrCosts">Затраты</button><button class="nav" data-page="mgrMore">Ещё</button>`:`<button class="nav active" data-page="empToday">Сегодня</button><button class="nav" data-page="empShifts">Смены</button><button class="nav" data-page="empMoney">Деньги</button><button class="nav" data-page="empProfile">Профиль</button>`;return `<div class="app"><div class="top"><div><div class="brand">.B.A.D.Workshop</div><div class="sub">${esc(u.name)} · ${manager?'Руководитель':esc(u.position||'Сотрудник')}</div></div><button class="pill" id="logoutBtn">Выйти</button></div><main id="pages"></main></div><div class="bottom ${manager?'manager':'employee'}"><div class="bottom-inner">${nav}</div></div>`}
function wireCommon(){document.getElementById('logoutBtn').onclick=logout;document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('[data-page-section]').forEach(s=>s.classList.toggle('hidden',s.id!==b.dataset.page))})}
function renderEmployee(u){document.getElementById('pages').innerHTML=`<section id="empToday" data-page-section></section><section id="empShifts" class="hidden" data-page-section></section><section id="empMoney" class="hidden" data-page-section></section><section id="empProfile" class="hidden" data-page-section></section>`;renderEmpToday(u);renderEmpShifts(u);renderEmpMoney(u);renderEmpProfile(u)}
function renderEmpToday(u){const s=activeShiftFor(u.id);const el=document.getElementById('empToday');if(!s){el.innerHTML=`<div class="card hero"><div class="label">Смена не начата</div><div style="font-size:27px;font-weight:900;margin:10px 0 16px">${new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div><button class="btn primary" id="startShift">НАЧАТЬ СМЕНУ</button></div>${empRecentHtml(u)}`;document.getElementById('startShift').onclick=()=>openStartShift(u);return}const seg=activeSegment(s),c=calcShift(s);el.innerHTML=`<div class="card hero"><div class="label">${seg?'● Смена идёт':'Ⅱ Пауза'}</div><div class="timer">${fmtDur(c.ms)}</div><div style="font-weight:900">${seg?esc(projectById(seg.projectId)?.name||'Проект'):'Работа приостановлена'}</div><div class="muted">${seg?esc(seg.workType):'Пауза'}</div><div class="row" style="margin-top:16px"><button class="btn ${seg?'warn':'good'}" id="pauseShift">${seg?'ПАУЗА':'ПРОДОЛЖИТЬ'}</button><button class="btn" id="changeWork">СМЕНИТЬ</button></div><div class="row" style="margin-top:9px"><button class="btn" id="addExpense">+ РАСХОД</button><button class="btn" id="addTransport">ТРАНСПОРТ</button></div><button class="btn danger" id="finishShift" style="margin-top:9px">ЗАВЕРШИТЬ СМЕНУ</button></div><div class="section-title">Участки текущей смены</div><div class="timeline">${s.segments.map(seg=>employeeSegmentCard(seg)).join('')}</div>`;document.getElementById('pauseShift').onclick=()=>toggleEmployeePause(u,s);document.getElementById('changeWork').onclick=()=>openChangeWork(u,s);document.getElementById('addExpense').onclick=()=>openEmployeeExpense(u,s);document.getElementById('addTransport').onclick=()=>openEmployeeTransport(u,s);document.getElementById('finishShift').onclick=()=>finishEmployeeShift(u,s);document.querySelectorAll('[data-edit-seg]').forEach(b=>b.onclick=()=>openEmployeeSegmentComment(u,s,b.dataset.editSeg))}
function employeeSegmentCard(seg){return `<div class="segment"><div class="item"><div class="item-head"><div><b>${esc(projectById(seg.projectId)?.name||'Проект')}</b><div class="muted">${esc(seg.workType)} · ${fmtTime(seg.start)}–${seg.end?fmtTime(seg.end):'сейчас'}</div></div><button class="btn small" data-edit-seg="${seg.id}">Комментарий</button></div>${publicSegmentHtml(seg,false)}</div></div>`}
function empRecentHtml(u){const last=state.shifts.filter(s=>s.employeeId===u.id&&s.status!=='active').sort((a,b)=>b.start-a.start).slice(0,3);return `<div class="section-title">Последние смены</div><div class="list">${last.length?last.map(s=>{const c=calcShift(s,s.end||now());return `<div class="item"><div class="item-head"><div><b>${fmtDate(s.start)}</b><div class="muted">${fmtDur(c.ms)}</div></div><span class="status ${statusClass(s)}">${statusText(s)}</span></div><div class="money" style="margin-top:7px">${fmtMoney(c.total)}</div></div>`}).join(''):'<div class="empty">Смен пока нет</div>'}</div>`}
function openStartShift(u){const activeProjects=state.projects.filter(p=>p.active);modal(`<h3>Начать смену</h3><div class="field"><label>Проект</label><select id="startProject">${activeProjects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Что делаете</label><select id="startWork">${state.workTypes.map(w=>`<option>${esc(w)}</option>`).join('')}</select></div><div class="field"><label>Комментарий к участку</label><textarea id="startComment" placeholder="Что именно делаете"></textarea></div><div class="field"><label>Приватная заметка</label><textarea id="startPrivate" placeholder="Видна только вам"></textarea><div class="hint">Руководитель не видит приватную заметку.</div></div><button class="btn primary" id="confirmStart">НАЧАТЬ</button>`);document.getElementById('confirmStart').onclick=()=>{const t=now();state.shifts.push({id:uid('s'),employeeId:u.id,start:t,end:null,status:'active',segments:[{id:uid('sg'),projectId:document.getElementById('startProject').value,workType:document.getElementById('startWork').value,start:t,end:null,employeeComment:document.getElementById('startComment').value.trim(),managerReply:'',privateNote:document.getElementById('startPrivate').value.trim()}],expenses:[],transport:[]});save();closeModal();renderEmployee(u)}}
function toggleEmployeePause(u,s){const seg=activeSegment(s);if(seg){seg.end=now();save();renderEmployee(u)}else openChangeWork(u,s,true)}
function openChangeWork(u,s,resume=false){const seg=activeSegment(s);modal(`<h3>${resume?'Продолжить':'Сменить работу'}</h3><div class="field"><label>Проект</label><select id="chgProject">${state.projects.filter(p=>p.active).map(p=>`<option value="${p.id}" ${seg&&p.id===seg.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Что делаете</label><select id="chgWork">${state.workTypes.map(w=>`<option ${seg&&w===seg.workType?'selected':''}>${esc(w)}</option>`).join('')}</select></div><div class="field"><label>Комментарий к новому участку</label><textarea id="chgComment"></textarea></div><div class="field"><label>Приватная заметка</label><textarea id="chgPrivate" placeholder="Только для вас"></textarea></div><button class="btn primary" id="confirmChange">НАЧАТЬ УЧАСТОК</button>`);document.getElementById('confirmChange').onclick=()=>{const a=activeSegment(s);if(a)a.end=now();s.segments.push({id:uid('sg'),projectId:document.getElementById('chgProject').value,workType:document.getElementById('chgWork').value,start:now(),end:null,employeeComment:document.getElementById('chgComment').value.trim(),managerReply:'',privateNote:document.getElementById('chgPrivate').value.trim()});save();closeModal();renderEmployee(u)}}
function openEmployeeSegmentComment(u,s,segId){const seg=s.segments.find(x=>x.id===segId);if(!seg)return;modal(`<h3>Комментарий к участку</h3><div class="muted">${esc(projectById(seg.projectId)?.name||'Проект')} · ${esc(seg.workType)}</div><div class="field"><label>Комментарий для руководителя</label><textarea id="segPublic">${esc(seg.employeeComment||'')}</textarea></div>${seg.managerReply?`<div class="comment manager"><strong>Ответ руководителя</strong>${esc(seg.managerReply)}</div>`:''}<div class="field"><label>Приватная заметка</label><textarea id="segPrivate">${esc(seg.privateNote||'')}</textarea><div class="hint">Эта заметка видна только вам.</div></div><button class="btn primary" id="saveSegComment">СОХРАНИТЬ</button>`);document.getElementById('saveSegComment').onclick=()=>{seg.employeeComment=document.getElementById('segPublic').value.trim();seg.privateNote=document.getElementById('segPrivate').value.trim();save();closeModal();renderEmployee(u)}}
function openEmployeeExpense(u,s){modal(`<h3>Расход сотрудника</h3><div class="notice">Этот расход попадёт руководителю как сумма, которую вы потратили в пользу проекта.</div><div class="field"><label>Проект</label><select id="exProject">${state.projects.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Категория</label><select id="exCat"><option>Материалы</option><option>Инструмент</option><option>Парковка</option><option>Доставка</option><option>Прочее</option></select></div><div class="field"><label>Сумма, грн</label><input id="exAmount" type="number" inputmode="decimal"></div><div class="field"><label>Комментарий</label><textarea id="exComment"></textarea></div><button class="btn primary" id="saveExpense">СОХРАНИТЬ</button>`);document.getElementById('saveExpense').onclick=()=>{const amount=Number(document.getElementById('exAmount').value);if(!amount)return;s.expenses.push({id:uid('ex'),projectId:document.getElementById('exProject').value,category:document.getElementById('exCat').value,amount,comment:document.getElementById('exComment').value.trim(),status:'pending'});save();closeModal();renderEmployee(u)}}
function openEmployeeTransport(u,s){modal(`<h3>Транспорт</h3><div class="field"><label>Проект</label><select id="trProject">${state.projects.filter(p=>p.active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Тип</label><select id="trType"><option>Такси</option><option>Личный автомобиль</option><option>Топливо</option><option>Парковка</option><option>Другое</option></select></div><div class="field"><label>Сумма / компенсация, грн</label><input id="trAmount" type="number" inputmode="decimal"></div><div class="field"><label>Комментарий / маршрут</label><textarea id="trComment"></textarea></div><button class="btn primary" id="saveTransport">СОХРАНИТЬ</button>`);document.getElementById('saveTransport').onclick=()=>{const amount=Number(document.getElementById('trAmount').value);if(!amount)return;s.transport.push({id:uid('tr'),projectId:document.getElementById('trProject').value,type:document.getElementById('trType').value,amount,comment:document.getElementById('trComment').value.trim(),status:'pending'});save();closeModal();renderEmployee(u)}}
function finishEmployeeShift(u,s){const seg=activeSegment(s);if(seg)seg.end=now();s.end=now();const c=calcShift(s,s.end);modal(`<h3>Завершение смены</h3><div class="card"><div>Отработано: <b>${fmtDur(c.ms)}</b></div><div>Предварительно за работу: <b>${fmtMoney(c.workPay+c.restBonus)}</b></div><div>Расходы сотрудника: <b>${fmtMoney(c.expenses)}</b></div><div>Транспорт: <b>${fmtMoney(c.transport)}</b></div><hr class="divider"><div class="big-number">${fmtMoney(c.total)}</div><div class="hint">Финальная сумма подтверждается руководителем.</div></div><button class="btn primary" id="submitShift">ОТПРАВИТЬ РУКОВОДИТЕЛЮ</button><button class="btn" id="cancelFinish" style="margin-top:8px">Вернуться</button>`);document.getElementById('cancelFinish').onclick=()=>{s.end=null;if(s.segments.length&&!activeSegment(s)){const last=s.segments[s.segments.length-1];last.end=null}closeModal();renderEmployee(u)};document.getElementById('submitShift').onclick=()=>{s.status='submitted';save();closeModal();renderEmployee(u)}}
function renderEmpShifts(u){const arr=state.shifts.filter(s=>s.employeeId===u.id).sort((a,b)=>b.start-a.start);document.getElementById('empShifts').innerHTML=`<div class="section-title">Мои смены</div><div class="list">${arr.map(s=>{const c=calcShift(s,s.end||now());return `<div class="item clickable" data-emp-shift="${s.id}"><div class="item-head"><div><b>${fmtDate(s.start)}</b><div class="muted">${fmtDur(c.ms)} · ${s.segments.length} участков</div></div><span class="status ${statusClass(s)}">${statusText(s)}</span></div><div class="money" style="margin-top:7px">${fmtMoney(c.total)}</div></div>`}).join('')||'<div class="empty">Смен пока нет</div>'}</div>`;document.querySelectorAll('[data-emp-shift]').forEach(x=>x.onclick=()=>openEmployeeShiftDetail(u,x.dataset.empShift))}
function openEmployeeShiftDetail(u,id){const s=state.shifts.find(x=>x.id===id);if(!s)return;const c=calcShift(s,s.end||now());modal(`<h3>Смена ${fmtDate(s.start)}</h3><div class="muted">${fmtTime(s.start)}–${s.end?fmtTime(s.end):'сейчас'} · ${statusText(s)}</div><div class="timeline" style="margin-top:16px">${s.segments.map(seg=>`<div class="segment"><div class="item"><b>${esc(projectById(seg.projectId)?.name||'Проект')}</b><div class="muted">${esc(seg.workType)} · ${fmtDur((seg.end||now())-seg.start)}</div>${publicSegmentHtml(seg,false)}${s.status==='active'?`<button class="btn small" data-detail-edit="${seg.id}" style="margin-top:8px">Изменить комментарий</button>`:''}</div></div>`).join('')}</div><div class="card"><div>Работа: <b>${fmtMoney(c.workPay+c.restBonus)}</b></div><div>Расходы: <b>${fmtMoney(c.expenses)}</b></div><div>Транспорт: <b>${fmtMoney(c.transport)}</b></div><hr class="divider"><div class="money">Итого ${fmtMoney(c.total)}</div></div>`);document.querySelectorAll('[data-detail-edit]').forEach(b=>b.onclick=()=>openEmployeeSegmentComment(u,s,b.dataset.detailEdit))}
function renderEmpMoney(u){const shifts=state.shifts.filter(s=>s.employeeId===u.id&&s.status==='approved');const total=shifts.reduce((a,s)=>a+calcShift(s,s.end||now()).total,0);const paid=state.payments.filter(p=>p.employeeId===u.id).reduce((a,p)=>a+Number(p.amount||0),0);document.getElementById('empMoney').innerHTML=`<div class="section-title">Деньги</div><div class="kpis"><div class="kpi"><span>Подтверждено</span><b>${fmtMoney(total)}</b></div><div class="kpi"><span>Выплачено</span><b>${fmtMoney(paid)}</b></div><div class="kpi"><span>К выплате</span><b>${fmtMoney(total-paid)}</b></div><div class="kpi"><span>Смен</span><b>${shifts.length}</b></div></div>`}
function renderEmpProfile(u){const r=ruleFor(u.id);document.getElementById('empProfile').innerHTML=`<div class="section-title">Профиль</div><div class="card"><b>${esc(u.name)}</b><div class="muted">${esc(u.position||'Сотрудник')}</div><hr class="divider"><div class="section-sub">Условия оплаты · только просмотр</div><div>Смена: <b>${fmtMoney(r.baseShift)}</b></div><div>Норма смены: <b>${r.baseHours} ч</b></div><div>Переработка: <b>${fmtMoney(r.overtime)}/ч</b></div><div>Минимальный межсменный отдых: <b>${r.restThreshold} ч</b></div><div>Компенсация короткого отдыха: <b>${fmtMoney(r.shortRestBonus)}</b></div><div class="notice">Сотрудник не может изменять тарифы, проекты или свой уровень доступа.</div></div>`}
function renderManager(u){document.getElementById('pages').innerHTML=`<section id="mgrDash" data-page-section></section><section id="mgrProjects" class="hidden" data-page-section></section><section id="mgrPeople" class="hidden" data-page-section></section><section id="mgrCosts" class="hidden" data-page-section></section><section id="mgrMore" class="hidden" data-page-section></section>`;renderMgrDash(u);renderMgrProjects(u);renderMgrPeople(u);renderMgrCosts(u);renderMgrMore(u)}
function renderMgrDash(u){const day0=startOfDay(),day1=endOfDay();const active=state.shifts.filter(s=>s.status==='active'),review=state.shifts.filter(s=>s.status==='submitted');const dayShifts=state.shifts.filter(s=>s.start<day1&&(s.end||now())>=day0);const dayPay=dayShifts.reduce((a,s)=>a+calcShift(s,s.end||now()).workPay+calcShift(s,s.end||now()).restBonus,0);const dayCosts=state.projectCosts.filter(c=>c.date>=day0&&c.date<day1).reduce((a,c)=>a+Number(c.amount||0),0);const projects=state.projects.filter(p=>p.active);document.getElementById('mgrDash').innerHTML=`<div class="section-title">Оперативная сводка</div><div class="section-sub">Автообновление экрана каждую минуту · анализ сгруппирован по часам</div><div class="kpis"><div class="kpi"><span>Работают сейчас</span><b>${active.length}</b></div><div class="kpi"><span>Смен на проверке</span><b>${review.length}</b></div><div class="kpi"><span>Работа сегодня</span><b>${fmtMoney(dayPay)}</b></div><div class="kpi"><span>Затраты проектов сегодня</span><b>${fmtMoney(dayCosts)}</b></div></div><div class="section-title">Сейчас работают</div><div class="list">${active.length?active.map(managerActiveShiftHtml).join(''):'<div class="empty">Сейчас активных смен нет</div>'}</div><div class="section-title">На проверке</div><div class="list">${review.length?review.map(s=>managerReviewHtml(s)).join(''):'<div class="empty">Нет смен на проверке</div>'}</div><div class="section-title">Проекты · сегодня / всего</div><div class="list">${projects.map(p=>projectSummaryHtml(p,day0,day1)).join('')}</div><div class="section-title">Почасовая картина за сегодня</div><div class="card scroll-x">${hourlyTable(day0)}</div>`;document.querySelectorAll('[data-mgr-open-shift]').forEach(b=>b.onclick=()=>openManagerShift(b.dataset.mgrOpenShift));document.querySelectorAll('[data-approve-shift]').forEach(b=>b.onclick=()=>approveShift(b.dataset.approveShift));document.querySelectorAll('[data-reply-active]').forEach(b=>b.onclick=()=>openManagerSegmentReply(b.dataset.replyActive));state.settings.lastManagerSnapshot=now();save()}
function managerActiveShiftHtml(s){const emp=userById(s.employeeId),seg=activeSegment(s),c=calcShift(s);return `<div class="item"><div class="item-head"><div><b><span class="badge-dot"></span>${esc(emp?.name||'Сотрудник')}</b><div class="muted">${seg?esc(projectById(seg.projectId)?.name||'Проект')+' · '+esc(seg.workType):'Пауза'} · ${fmtDur(c.ms)}</div></div><button class="btn small" data-mgr-open-shift="${s.id}">Открыть</button></div>${seg&&seg.employeeComment?publicSegmentHtml(seg,true):''}</div>`}
function managerReviewHtml(s){const emp=userById(s.employeeId),c=calcShift(s,s.end||now());return `<div class="item"><div class="item-head"><div><b>${esc(emp?.name||'Сотрудник')}</b><div class="muted">${fmtDate(s.start)} · ${fmtDur(c.ms)} · ${fmtMoney(c.total)}</div></div><span class="status warn">На проверке</span></div><div class="row" style="margin-top:9px"><button class="btn small" data-mgr-open-shift="${s.id}">Проверить</button><button class="btn small good" data-approve-shift="${s.id}">Подтвердить</button></div></div>`}
function projectSummaryHtml(p,day0,day1){const td=projectLabor(p.id,day0,day1),all=projectLabor(p.id,0,Infinity),cDay=managerProjectCost(p.id,day0,day1),cAll=managerProjectCost(p.id,0,Infinity);return `<div class="item"><b>${esc(p.name)}</b><div class="row" style="margin-top:8px"><div><span class="mini muted">Сегодня</span><div>${fmtDur(td.ms)} · ${fmtMoney(td.cost+cDay)}</div></div><div><span class="mini muted">За всё время</span><div>${fmtDur(all.ms)} · ${fmtMoney(all.cost+cAll)}</div></div></div></div>`}
function hourlyTable(day0){const rows=[];for(let h=0;h<24;h++){const a=day0+h*3600000,b=a+3600000;const parts=[];for(const s of state.shifts){const emp=userById(s.employeeId);for(const seg of s.segments||[]){const x=Math.max(a,seg.start),y=Math.min(b,seg.end||now());if(y>x)parts.push(`${esc(emp?.name||'—')} · ${esc(projectById(seg.projectId)?.name||'—')} · ${fmtDur(y-x)}`)}}if(parts.length)rows.push(`<tr><td class="nowrap">${String(h).padStart(2,'0')}:00</td><td>${parts.join('<br>')}</td></tr>`)}return `<table class="table"><thead><tr><th>Час</th><th>Сотрудник · проект · время</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="2" class="muted">Сегодня ещё нет данных</td></tr>'}</tbody></table>`}
function openManagerShift(id){const s=state.shifts.find(x=>x.id===id);if(!s)return;const emp=userById(s.employeeId),c=calcShift(s,s.end||now());modal(`<h3>${esc(emp?.name||'Сотрудник')} · ${fmtDate(s.start)}</h3><div class="muted">${fmtTime(s.start)}–${s.end?fmtTime(s.end):'сейчас'} · ${statusText(s)}</div><div class="timeline" style="margin-top:16px">${s.segments.map(seg=>`<div class="segment"><div class="item"><div class="item-head"><div><b>${esc(projectById(seg.projectId)?.name||'Проект')}</b><div class="muted">${esc(seg.workType)} · ${fmtTime(seg.start)}–${seg.end?fmtTime(seg.end):'сейчас'}</div></div><button class="btn small blue" data-reply-seg="${seg.id}">Ответить</button></div>${publicSegmentHtml(seg,true)}</div></div>`).join('')}</div><div class="card"><div>Работа + доплаты: <b>${fmtMoney(c.workPay+c.restBonus)}</b></div><div>Расходы сотрудника: <b>${fmtMoney(c.expenses)}</b></div><div>Транспорт: <b>${fmtMoney(c.transport)}</b></div><hr class="divider"><div class="big-number">${fmtMoney(c.total)}</div></div>${s.status==='submitted'?`<button class="btn good" id="modalApprove">ПОДТВЕРДИТЬ СМЕНУ</button>`:''}`);document.querySelectorAll('[data-reply-seg]').forEach(b=>b.onclick=()=>openManagerSegmentReply(b.dataset.replySeg));const ab=document.getElementById('modalApprove');if(ab)ab.onclick=()=>{approveShift(s.id);closeModal()}}
function openManagerSegmentReply(segId){let target=null;for(const s of state.shifts){const seg=s.segments.find(x=>x.id===segId);if(seg){target=seg;break}}if(!target)return;modal(`<h3>Ответ на комментарий</h3>${target.employeeComment?`<div class="comment"><strong>Комментарий сотрудника</strong>${esc(target.employeeComment)}</div>`:'<div class="notice">Сотрудник пока не оставил публичный комментарий к этому участку.</div>'}<div class="field"><label>Ответ руководителя</label><textarea id="managerReply">${esc(target.managerReply||'')}</textarea></div><button class="btn primary" id="saveManagerReply">СОХРАНИТЬ ОТВЕТ</button>`);document.getElementById('saveManagerReply').onclick=()=>{target.managerReply=document.getElementById('managerReply').value.trim();save();closeModal();renderManager(currentUser())}}
function approveShift(id){const s=state.shifts.find(x=>x.id===id);if(!s)return;s.status='approved';for(const e of s.expenses||[])e.status='approved';for(const t of s.transport||[])t.status='approved';save();renderManager(currentUser())}
function renderMgrProjects(u){document.getElementById('mgrProjects').innerHTML=`<div class="section-title">Проекты</div><button class="btn primary" id="addProject">+ НОВЫЙ ПРОЕКТ</button><div class="list" style="margin-top:10px">${state.projects.map(p=>`<div class="item"><div class="item-head"><div><b>${esc(p.name)}</b><div class="muted">${p.active?'Активный':'Завершён'}</div></div><button class="btn small ${p.active?'warn':'good'}" data-project-toggle="${p.id}">${p.active?'Завершить':'Возобновить'}</button></div></div>`).join('')}</div>`;document.getElementById('addProject').onclick=()=>openAddProject(u);document.querySelectorAll('[data-project-toggle]').forEach(b=>b.onclick=()=>{const p=projectById(b.dataset.projectToggle);if(p){p.active=!p.active;save();renderMgrProjects(u)}})}
function openAddProject(u){modal(`<h3>Новый проект</h3><div class="field"><label>Название</label><input id="newProjectName" placeholder="Название проекта"></div><button class="btn primary" id="saveProject">СОЗДАТЬ ПРОЕКТ</button>`);document.getElementById('saveProject').onclick=()=>{const name=document.getElementById('newProjectName').value.trim();if(!name)return;state.projects.push({id:uid('p'),name,active:true,createdBy:u.id,createdAt:now()});save();closeModal();renderMgrProjects(u)}}
function renderMgrPeople(u){const pending=state.users.filter(x=>x.role==='employee'&&!x.approved),approved=state.users.filter(x=>x.role==='employee'&&x.approved);document.getElementById('mgrPeople').innerHTML=`<div class="section-title">Доступ к приложению</div><div class="list">${pending.length?pending.map(x=>`<div class="item"><div class="item-head"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.position||'Сотрудник')} · ${esc(x.email)}</div></div><span class="status warn">Ожидает</span></div><div class="row" style="margin-top:9px"><button class="btn small good" data-approve-user="${x.id}">Разрешить</button><button class="btn small danger" data-reject-user="${x.id}">Отклонить</button></div></div>`).join(''):'<div class="empty">Новых запросов нет</div>'}</div><div class="section-title">Сотрудники</div><div class="list">${approved.map(x=>employeeManagerCard(x)).join('')}</div>`;document.querySelectorAll('[data-approve-user]').forEach(b=>b.onclick=()=>{const x=userById(b.dataset.approveUser);x.approved=true;if(!state.payRules[x.id])state.payRules[x.id]={baseShift:0,baseHours:12,overtime:0,nightPct:0,restThreshold:8,shortRestBonus:0};save();renderMgrPeople(u)});document.querySelectorAll('[data-reject-user]').forEach(b=>b.onclick=()=>{state.users=state.users.filter(x=>x.id!==b.dataset.rejectUser);save();renderMgrPeople(u)});document.querySelectorAll('[data-pay-user]').forEach(b=>b.onclick=()=>openPayRule(b.dataset.payUser))}
function employeeManagerCard(x){const r=ruleFor(x.id),s=activeShiftFor(x.id);return `<div class="item"><div class="item-head"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.position||'Сотрудник')} ${s?'· сейчас работает':''}</div></div><button class="btn small" data-pay-user="${x.id}">Оплата</button></div><div class="mini" style="margin-top:8px">Смена ${fmtMoney(r.baseShift)} · ${r.baseHours} ч · переработка ${fmtMoney(r.overtime)}/ч</div></div>`}
function openPayRule(employeeId){const x=userById(employeeId),r=ruleFor(employeeId);modal(`<h3>Условия оплаты · ${esc(x?.name||'')}</h3><div class="field"><label>Стоимость смены, грн</label><input id="payBase" type="number" inputmode="decimal" value="${r.baseShift}"></div><div class="field"><label>Норма смены, часов</label><input id="payHours" type="number" inputmode="decimal" value="${r.baseHours}"></div><div class="field"><label>Переработка, грн/час</label><input id="payOver" type="number" inputmode="decimal" value="${r.overtime}"></div><div class="field"><label>Минимальный отдых между сменами, часов</label><input id="payRest" type="number" inputmode="decimal" value="${r.restThreshold}"></div><div class="field"><label>Доплата за короткий отдых, грн</label><input id="payRestBonus" type="number" inputmode="decimal" value="${r.shortRestBonus}"></div><button class="btn primary" id="savePayRule">СОХРАНИТЬ</button>`);document.getElementById('savePayRule').onclick=()=>{state.payRules[employeeId]={...r,baseShift:Number(document.getElementById('payBase').value)||0,baseHours:Number(document.getElementById('payHours').value)||0,overtime:Number(document.getElementById('payOver').value)||0,restThreshold:Number(document.getElementById('payRest').value)||0,shortRestBonus:Number(document.getElementById('payRestBonus').value)||0};save();closeModal();renderMgrPeople(currentUser())}}
function renderMgrCosts(u){const costs=[...state.projectCosts].sort((a,b)=>b.date-a.date);document.getElementById('mgrCosts').innerHTML=`<div class="section-title">Затраты проектов</div><div class="section-sub">Это прямые затраты проекта, которые вносит руководитель. Они не считаются долгом сотруднику.</div><button class="btn primary" id="addProjectCost">+ ДОБАВИТЬ ЗАТРАТУ</button><div class="list" style="margin-top:10px">${costs.length?costs.map(c=>`<div class="item"><div class="item-head"><div><b>${esc(projectById(c.projectId)?.name||'Проект')}</b><div class="muted">${fmtDate(c.date)} · ${esc(c.category)}</div></div><div class="money">${fmtMoney(c.amount)}</div></div>${c.comment?`<div class="comment">${esc(c.comment)}</div>`:''}</div>`).join(''):'<div class="empty">Затрат пока нет</div>'}</div>`;document.getElementById('addProjectCost').onclick=()=>openProjectCost(u)}
function openProjectCost(u){modal(`<h3>Затрата проекта</h3><div class="field"><label>Проект</label><select id="costProject">${state.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Категория</label><select id="costCat"><option>Материалы</option><option>Аренда</option><option>Транспорт</option><option>Подрядчик</option><option>Питание</option><option>Прочее</option></select></div><div class="field"><label>Сумма, грн</label><input id="costAmount" type="number" inputmode="decimal"></div><div class="field"><label>Комментарий</label><textarea id="costComment"></textarea></div><button class="btn primary" id="saveCost">СОХРАНИТЬ</button>`);document.getElementById('saveCost').onclick=()=>{const amount=Number(document.getElementById('costAmount').value);if(!amount)return;state.projectCosts.push({id:uid('c'),projectId:document.getElementById('costProject').value,date:now(),category:document.getElementById('costCat').value,amount,comment:document.getElementById('costComment').value.trim(),createdBy:u.id});save();closeModal();renderMgrCosts(u)}}
function renderMgrMore(u){const allApproved=state.shifts.filter(s=>s.status==='approved');const totalPay=allApproved.reduce((a,s)=>a+calcShift(s,s.end||now()).workPay+calcShift(s,s.end||now()).restBonus,0);const claims=allApproved.reduce((a,s)=>a+expensesSum(s)+transportSum(s),0);const projectCost=state.projectCosts.reduce((a,c)=>a+Number(c.amount||0),0);document.getElementById('mgrMore').innerHTML=`<div class="section-title">Общая аналитика</div><div class="kpis"><div class="kpi"><span>Оплата труда</span><b>${fmtMoney(totalPay)}</b></div><div class="kpi"><span>Компенсации людям</span><b>${fmtMoney(claims)}</b></div><div class="kpi"><span>Прямые затраты проектов</span><b>${fmtMoney(projectCost)}</b></div><div class="kpi"><span>Всего учтено</span><b>${fmtMoney(totalPay+claims+projectCost)}</b></div></div><div class="card"><b>Часовая аналитика</b><div class="muted" style="margin-top:5px">Пока приложение открыто у руководителя, сводка пересчитывается каждую минуту. Таблица на главном экране группирует фактическую работу по часам, сотрудникам и проектам.</div><div class="notice">Для настоящего фонового уведомления раз в час, даже когда приложение закрыто, на следующем серверном этапе понадобится планировщик + push-уведомления. Структура данных уже подготовлена.</div></div><div class="card"><b>Режим хранения</b><div class="muted" style="margin-top:5px">${cfg.supabaseUrl?'Конфигурация сервера указана.':'Сейчас эта сборка работает локально на устройстве. Следующий этап — подключить общую Supabase-базу для всех телефонов.'}</div></div>`}
function updateNetworkBadge(){document.getElementById('offlineBadge').classList.toggle('hidden',navigator.onLine)}
window.addEventListener('online',updateNetworkBadge);window.addEventListener('offline',updateNetworkBadge);updateNetworkBadge();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
setInterval(()=>{const u=currentUser();if(!u)return;if(u.role==='manager'){const activePage=document.querySelector('.nav.active')?.dataset.page;if(activePage==='mgrDash')renderMgrDash(u)}else if(u.role==='employee'){const activePage=document.querySelector('.nav.active')?.dataset.page;if(activePage==='empToday')renderEmpToday(u)}},60000);
renderApp();
})();
</script>
</body>
