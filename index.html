x solid var(--line);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));z-index:20}.bottom-inner{max-width:720px;margin:auto;display:grid;gap:4px}.bottom.employee .bottom-inner{grid-template-columns:repeat(4,1fr)}.bottom.manager .bottom-inner{grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:12px;font-size:11px}.nav.active{background:#eef0f3;color:var(--ink);font-weight:950}.modal{position:fixed;inset:0;background:rgba(10,12,16,.48);display:flex;align-items:flex-end;z-index:50}.sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 15px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheet h3{margin:0 0 8px}.notice{padding:12px;border-radius:14px;background:#fff6df;color:#845100;font-size:13px;margin:10px 0}.notice.good{background:var(--goodbg);color:var(--good)}.notice.blue{background:var(--bluebg);color:var(--blue)}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 15px 40px rgba(17,19,24,.08)}.login-brand{font-size:27px;font-weight:950}.login-tag{color:var(--muted);margin:3px 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eff1f4;border-radius:14px;padding:4px;margin:12px 0}.tab{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:850}.tab.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-weight:750}.nowrap{white-space:nowrap}.right{text-align:right!important}.empty{padding:18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.badge-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:5px}.login-error{color:var(--danger);font-size:13px;margin-top:9px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar .btn{width:auto}.big-number{font-size:27px;font-weight:950}.scroll-x{overflow:auto;-webkit-overflow-scrolling:touch}.mini{font-size:11px}.clickable{cursor:pointer}.offline{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:80;background:#111318;color:#fff;border-radius:999px;padding:7px 11px;font-size:11px}.green{color:var(--good)}.red{color:var(--danger)}.bar{height:9px;background:#edf0f3;border-radius:99px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:#111318;border-radius:99px}.statline{display:flex;justify-content:space-between;gap:14px;margin:7px 0;font-size:13px}.statline b{text-align:right}.filterbar{display:flex;gap:7px;overflow:auto;padding:2px 0 7px;-webkit-overflow-scrolling:touch}.type-badge{display:inline-block;border-radius:999px;background:#eef0f3;padding:5px 8px;font-size:11px;margin-top:6px}.sep{height:1px;background:var(--line);margin:12px 0}.positive{color:var(--good)}.negative{color:var(--danger)}
